[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "harpertoken-pole"
version = "0.1.0"
description = "This model solves CartPole-v1 using CMA-ES with a linear policy."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.21.0",
    "gymnasium>=0.29.0",
    "cma>=3.0.0",
    "huggingface-hub>=0.10.0",
    "matplotlib>=3.0.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Needed only for harpertoken.models.hf_policy, which serialises the same
# weights as config.json plus model.safetensors for AutoModel.from_pretrained.
hf = [
    "torch>=2.0",
    "transformers>=4.40",
]
dev = [
     "pytest>=7.0.0",
     "pytest-asyncio>=0.21.0",
     "ruff>=0.1.0",
     "pre-commit>=3.0.0",
 ]

[project.urls]
HuggingFace = "https://huggingface.co/harpertoken/pole"

[tool.setuptools.packages.find]
where = ["."]
include = ["harpertoken*"]

[tool.setuptools.package-data]
harpertoken = ["*.py"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "N"]

[tool.ruff.lint.per-file-ignores]
# model_card.py embeds the model card as a Markdown string. Paragraphs there are
# deliberately kept on one line, as is conventional for Markdown, so the
# line-length rule does not apply to it.
"harpertoken/hub/model_card.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"